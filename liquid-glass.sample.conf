# Liquid glass sample configuration
#
# Outward refraction, strong colour fringe and highlight, 6px gaussian frost.
# Needs a picom built from the liquid-glass branch; older builds reject the
# "liquid_glass" blur method.

# liquid_glass is implemented for the glx and egl backends only.
backend = "glx";

# The glass follows the window shape, including rounded corners. The
# screenshots were taken with 30; with 0 the pane is a sharp rectangle.
corner-radius = 30;

blur: {
  method = "liquid_glass";
  refraction = -40;             # px of bending at the rim; negative bends outward
  bezel = 28;                   # px width of the curved rim (default)
  chromatic-aberration = 0.6;   # 0-1, colour fringe along the rim
  frost = 6;                    # px gaussian blur radius, 0 = perfectly clear
  highlight = 0.7;              # 0-1, specular rim highlight
  tint = 0.04;                  # 0-1, tint toward white (default)
  saturation = 1.15;            # saturation seen through the glass (default)
  background = true;
  background-frame = false;
  background-fixed = false;
}

# Glass only shows through windows that are at least partly transparent.
# Your current setup limits blur to St, so the same rule is kept here:
blur-background-exclude = [
  "class_g != 'St'",
];
